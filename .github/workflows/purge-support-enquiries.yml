# Deletes closed support messages and marketing enquiries older than 12 months.
# Safe to run often: it only removes rows past the retention cutoff.
#
# Required GitHub secret (same value as Supabase secret TRIAL_EMAIL_CRON_SECRET):
#   TRIAL_EMAIL_CRON_SECRET
#
# Cash Prophet project ref: qwwwijyljghmlerylbpi
# Alternative: Supabase pg_cron via migration 040 (no GitHub secret needed).
name: Purge expired support and enquiries

on:
  schedule:
    # 03:15 UTC on the 1st of every month
    - cron: '15 3 1 * *'
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Call purge edge function
        env:
          CRON_SECRET: ${{ secrets.TRIAL_EMAIL_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "TRIAL_EMAIL_CRON_SECRET is not set — skipping purge (configure in repo Settings → Secrets)."
            exit 0
          fi
          curl -fsS -X POST \
            "https://qwwwijyljghmlerylbpi.supabase.co/functions/v1/purge-support-enquiries" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
